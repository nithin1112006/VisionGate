# ==============================================================================
# VisionGate / Attenda - Docker Compose Production Security & Logging Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ==============================================================================

services:
  postgres:
    restart: always
    ports:
      # Bind PostgreSQL port ONLY to host loopback (closed to WAN/LAN)
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  backend:
    restart: always
    ports:
      # Direct backend access bound to host loopback
      - "127.0.0.1:${BACKEND_PORT:-8001}:8001"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  nginx:
    restart: always
    ports:
      # Public HTTP ingress (or reverse proxied via Cloudflare)
      - "${HTTP_PORT:-80}:80"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  cloudflared:
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
