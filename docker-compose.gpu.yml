# ==============================================================================
# VisionGate / Attenda - Docker Compose GPU Hardware Acceleration Overlay
# Use when host has compatible NVIDIA GPU and nvidia-container-toolkit configured:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# ==============================================================================

services:
  backend:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
